[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rusal-sanitizer"
version = "0.1.0"
description = "Санитизация дампа MySQL: модель находит персональные данные, детерминированный механизм заменяет"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
sanitizer = ["name_pool.json"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
